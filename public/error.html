<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>michi 3d</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #14161e; color: #d7dbe6; font: 16px/1.6 system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  main { max-width: 460px; }
  .code { font-size: 96px; font-weight: 800; line-height: 1; margin: 0; color: #7aa2f7; letter-spacing: -2px; }
  h1 { font-size: 24px; margin: 8px 0 12px; color: #fff; }
  p { color: #aab1c3; margin: 8px 0; }
  .btn { display: inline-block; margin-top: 12px; padding: 10px 18px; border-radius: 8px; background: #7aa2f7; color: #14161e; font-weight: 600; text-decoration: none; }
  .lang { margin-top: 28px; font-size: 13px; }
  .lang button { background: none; border: none; color: #7aa2f7; cursor: pointer; font: inherit; text-decoration: underline; padding: 0; }
  .brand { margin-top: 28px; font-size: 13px; color: #6b7388; }
</style>
</head>
<body>
<main>
  <p class="code" id="code">404</p>
  <h1 id="title"></h1>
  <p id="text"></p>
  <p><a class="btn" id="back" href="/"></a></p>
  <p class="lang"><button id="switch" type="button"></button></p>
  <p class="brand">michi 3d</p>
</main>
<script>
(function () {
  // Textos por código de error y idioma. Esta página sirve como 404 de Vercel y, con ?code=NNN, como página genérica 4XX.
  var COPY = {
    400: { es: ["Petición incorrecta", "No se pudo entender la petición. Revisa la dirección e inténtalo de nuevo."], en: ["Bad request", "The request could not be understood. Check the address and try again."] },
    401: { es: ["No autorizado", "Necesitas iniciar sesión o tener permiso para ver esto."], en: ["Unauthorized", "You need to sign in or have permission to see this."] },
    403: { es: ["Acceso prohibido", "No tienes permiso para acceder a esta página."], en: ["Forbidden", "You don't have permission to access this page."] },
    404: { es: ["Página no encontrada", "Esta página no existe. A lo mejor el enlace está mal escrito."], en: ["Page not found", "This page doesn't exist. The link might be mistyped."] },
    405: { es: ["Método no permitido", "Esta página no admite ese tipo de petición."], en: ["Method not allowed", "This page doesn't accept that kind of request."] },
    408: { es: ["Tiempo de espera agotado", "La petición tardó demasiado. Inténtalo de nuevo."], en: ["Request timeout", "The request took too long. Please try again."] },
    410: { es: ["Ya no existe", "Esta página fue eliminada y no volverá."], en: ["Gone", "This page was removed and won't be back."] },
    413: { es: ["Petición demasiado grande", "Lo que enviaste es demasiado grande."], en: ["Payload too large", "What you sent is too large."] },
    414: { es: ["Dirección demasiado larga", "La dirección que abriste es demasiado larga."], en: ["URI too long", "The address you opened is too long."] },
    429: { es: ["Demasiadas peticiones", "Has hecho demasiadas peticiones seguidas. Espera un poco y vuelve a probar."], en: ["Too many requests", "You've made too many requests in a row. Give it a moment and try again."] }
  };
  var BACK = { es: "volver al juego", en: "back to the game" };
  var SWITCH = { es: "english", en: "español" };

  var q = new URLSearchParams(location.search);
  var code = parseInt(q.get("code") || "404", 10);
  if (!COPY[code]) code = 404;

  // Mismo criterio que el juego: idioma guardado → idioma del navegador (en* = inglés) → español.
  var lang = "es";
  try { var saved = localStorage.getItem("michi3d-lang"); if (saved === "es" || saved === "en") lang = saved; else if ((navigator.language || "").toLowerCase().indexOf("en") === 0) lang = "en"; } catch (e) {}
  var qlang = q.get("lang"); if (qlang === "es" || qlang === "en") lang = qlang;

  function render() {
    var c = COPY[code][lang];
    document.documentElement.lang = lang;
    document.title = code + " | " + c[0].toLowerCase() + " | michi 3d";
    document.getElementById("code").textContent = code;
    document.getElementById("title").textContent = c[0].toLowerCase();
    document.getElementById("text").textContent = c[1].toLowerCase();
    document.getElementById("back").textContent = BACK[lang];
    document.getElementById("switch").textContent = SWITCH[lang];
  }
  document.getElementById("switch").addEventListener("click", function () {
    lang = lang === "es" ? "en" : "es";
    try { localStorage.setItem("michi3d-lang", lang); } catch (e) {}
    render();
  });
  render();
})();
</script>
</body>
</html>
